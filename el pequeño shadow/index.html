<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow — El Pequeño Lobo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <h1>SHADOW</h1>
        <p>El pequeño lobo · Pixel Art Moderno</p>
      </div>
      <div class="story">Falta para la nieve: <strong id="snowDays">9d</strong></div>
    </header>

    <section class="hud">
      <span>Zona: <b id="zone">1</b></span>
      <span>Nv: <b id="level">1</b></span>
      <span>HP: <b id="hp">100</b></span>
      <span>XP: <b id="xp">0 / 100</b></span>
      <span id="furyText">Furia: OFF</span>
    </section>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="960" height="540" aria-label="Juego de Shadow"></canvas>
      <div id="pausePanel" class="pause hidden">
        <h2>PAUSA</h2>
        <p>Presiona <b>ESC</b> para continuar</p>
        <button id="restartBtn">Reiniciar zona</button>
      </div>
    </div>

    <div class="controls">
      <span><kbd>A</kbd><kbd>D</kbd> Mover</span>
      <span><kbd>F</kbd> Furia</span>
      <span><kbd>ESC</kbd> Pausa</span>
    </div>

    <p class="hint">Cruza el borde derecho para avanzar de zona. La dificultad aumenta en cada etapa.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
