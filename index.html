<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego Pixel Art - Lobito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="ui-header">
            <div id="stats">
                <span>HP: <span id="hp-val">85</span></span>
                <span>Zona: <span id="zone-val">1</span></span>
            </div>
            <div id="menu-buttons">
                <button id="btn-pause">Pausa</button>
                <button id="btn-save">Guardar</button>
            </div>
        </header>
        
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <div id="inventory-bar">
            <span>Colmillos / Reserva: <span id="inventory-val">Vacío</span></span>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
